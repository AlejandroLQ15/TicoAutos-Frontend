<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación en dos pasos - TicoAutos</title>
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/config.js"></script>
  <style>
    .status-icon { font-size: 2.5rem; margin-bottom: 0.5rem; display: block; }
    .otp-hint  { font-size: 0.8125rem; color: #64748b; margin: 0 0 1.25rem; text-align: center; }
    .otp-input-wrap { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.25rem; }
    .otp-digit {
      width: 44px; height: 56px;
      text-align: center; font-size: 1.5rem; font-weight: 600;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-family: inherit; color: #1e293b; background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .otp-digit:focus {
      outline: none; border-color: #0031a0;
      box-shadow: 0 0 0 3px rgba(0,49,160,0.12);
    }
    .otp-digit.filled { border-color: #0031a0; }
    .msg-error   { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .msg-success { color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .link-resend { background: none; border: none; color: #0031a0; font-family: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; padding: 0; text-decoration: underline; }
    .link-resend:disabled { color: #94a3b8; cursor: not-allowed; text-decoration: none; }
    .resend-row  { text-align: center; margin-top: 0.75rem; }
    .countdown-txt { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body class="auth-page">
<div class="auth-page-inner">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="../assets/TicoAutos_Logo.png" alt="TicoAutos" class="auth-logo-img">
        <span class="status-icon">🔐</span>
        <h1 class="auth-title">Verificación en dos pasos</h1>
        <p class="auth-subtitle">Ingresa el código que enviamos a tu teléfono</p>
      </div>

      <p class="otp-hint">El código tiene 6 dígitos y vence en 10 minutos.</p>

      <div id="msgError"   class="msg-error"></div>
      <div id="msgSuccess" class="msg-success"></div>

      <form id="otpForm" autocomplete="off">
        <div class="otp-input-wrap" id="otpWrap">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 1">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 2">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 3">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 4">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 5">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Dígito 6">
        </div>
        <button type="submit" class="btn-submit" id="btnVerify">Verificar código</button>
      </form>

      <div class="resend-row">
        <button class="link-resend" id="btnResend" type="button">Reenviar código</button>
        <span class="countdown-txt" id="countdownTxt"></span>
      </div>

      <div class="auth-footer">
        <p><a href="login.html">Cancelar y volver al inicio de sesión</a></p>
      </div>
    </div>
  </div>

  <footer class="app-footer app-footer-auth">
    <div class="app-footer-inner">
      <p class="app-footer-copy">© 2025 TicoAutos · Programación en Ambiente Web</p>
      <div class="app-footer-links">
        <a href="../index.html">Inicio</a>
        <a href="listado.html">Vehículos</a>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </footer>
</div>

<script>
  const API_BASE      = window.APP_CONFIG.API_BASE;
  const VERIFY_URL    = API_BASE + '/users/verify-2fa';
  const RESEND_URL    = API_BASE + '/users/resend-2fa';
  const AUTH_TOKEN_KEY = 'authToken';
  const AUTH_USER_KEY  = 'authUser';

  // El token temporal viene de sessionStorage (puesto por login.html)
  const pendingLoginToken = sessionStorage.getItem('pendingLoginToken');

  if (!pendingLoginToken) {
    // No hay sesión pendiente: redirigir a login
    window.location.replace('login.html');
  }

  // ── OTP Input: navegación automática entre dígitos ───────────────────────
  const digits = Array.from(document.querySelectorAll('.otp-digit'));

  digits.forEach((input, i) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val ? val[val.length - 1] : '';
      e.target.classList.toggle('filled', !!e.target.value);
      if (val && i < digits.length - 1) digits[i + 1].focus();
      if (getOTPValue().length === 6) document.getElementById('btnVerify').click();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        digits[i - 1].value = '';
        digits[i - 1].classList.remove('filled');
        digits[i - 1].focus();
      }
      if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); digits[i - 1].focus(); }
      if (e.key === 'ArrowRight' && i < digits.length - 1) { e.preventDefault(); digits[i + 1].focus(); }
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      text.split('').forEach((ch, j) => {
        if (digits[j]) { digits[j].value = ch; digits[j].classList.add('filled'); }
      });
      const next = Math.min(text.length, digits.length - 1);
      digits[next].focus();
      if (text.length === 6) document.getElementById('btnVerify').click();
    });
  });

  function getOTPValue() {
    return digits.map(d => d.value).join('');
  }

  function clearOTP() {
    digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
    digits[0].focus();
  }

  function showMsg(type, text) {
    document.getElementById('msgError').style.display   = 'none';
    document.getElementById('msgSuccess').style.display = 'none';
    if (type === 'error')   { document.getElementById('msgError').textContent   = text; document.getElementById('msgError').style.display   = 'block'; }
    if (type === 'success') { document.getElementById('msgSuccess').textContent = text; document.getElementById('msgSuccess').style.display = 'block'; }
  }

  // ── Envío del formulario ─────────────────────────────────────────────────
  document.getElementById('otpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const code = getOTPValue();
    if (code.length < 6) { showMsg('error', 'Ingresa los 6 dígitos del código.'); return; }

    const btn = document.getElementById('btnVerify');
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    showMsg('', '');

    try {
      const resp = await fetch(VERIFY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pendingLoginToken, code }),
      });
      const data = await resp.json().catch(() => ({}));

      if (resp.ok && data.success) {
        showMsg('success', '¡Verificación exitosa! Redirigiendo…');
        sessionStorage.removeItem('pendingLoginToken');
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify(data.user || {}));
        setTimeout(() => window.location.replace('../index.html'), 800);
      } else if (data.code === 'SESSION_EXPIRED' || data.code === 'INVALID_SESSION') {
        showMsg('error', 'La sesión expiró. Inicia sesión nuevamente.');
        sessionStorage.removeItem('pendingLoginToken');
        setTimeout(() => window.location.replace('login.html'), 2000);
      } else if (data.code === 'TOO_MANY_ATTEMPTS') {
        showMsg('error', 'Demasiados intentos incorrectos. Inicia sesión nuevamente.');
        sessionStorage.removeItem('pendingLoginToken');
        setTimeout(() => window.location.replace('login.html'), 2500);
      } else {
        showMsg('error', data.message || 'Código incorrecto. Intenta de nuevo.');
        clearOTP();
        btn.disabled = false;
        btn.textContent = 'Verificar código';
      }
    } catch {
      showMsg('error', 'Error de conexión. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = 'Verificar código';
    }
  });

  // ── Reenviar código SMS ──────────────────────────────────────────────────
  let cooldownInterval = null;

  function startCooldown(seconds) {
    const btn      = document.getElementById('btnResend');
    const txt      = document.getElementById('countdownTxt');
    let remaining  = seconds;
    btn.disabled   = true;

    const tick = () => {
      txt.textContent = ` (${remaining}s)`;
      if (remaining <= 0) {
        clearInterval(cooldownInterval);
        btn.disabled = false;
        txt.textContent = '';
      }
      remaining--;
    };
    tick();
    cooldownInterval = setInterval(tick, 1000);
  }

  document.getElementById('btnResend').addEventListener('click', async function () {
    this.disabled = true;
    showMsg('', '');
    try {
      const resp = await fetch(RESEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pendingLoginToken }),
      });
      const data = await resp.json().catch(() => ({}));

      if (resp.status === 429) {
        const match = (data.message || '').match(/(\d+)\s*segundo/);
        startCooldown(match ? parseInt(match[1], 10) : 120);
        showMsg('error', data.message || 'Espera antes de solicitar otro código.');
      } else if (resp.ok && data.success) {
        showMsg('success', 'Nuevo código enviado a tu teléfono.');
        clearOTP();
        startCooldown(120);
      } else {
        showMsg('error', data.message || 'No se pudo reenviar el código.');
        this.disabled = false;
      }
    } catch {
      showMsg('error', 'Error de conexión. Intenta de nuevo.');
      this.disabled = false;
    }
  });

  // Auto-focus en el primer dígito al cargar
  window.addEventListener('DOMContentLoaded', () => digits[0].focus());
</script>
</body>
</html>
