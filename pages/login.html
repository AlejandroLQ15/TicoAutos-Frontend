<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Iniciar sesión - TicoAutos</title>
  
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/config.js"></script>
  <style>
    .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: #888; font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ddd; }
    .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px; border: 1.5px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 500; color: #333; transition: background 0.15s; }
    .btn-google:hover { background: #f5f5f5; }
    .btn-google svg { flex-shrink: 0; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-page-inner">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
         <img src="../assets/TicoAutos_Logo.png" alt="TicoAutos" class="auth-logo-img">
        <h1 class="auth-title">Iniciar sesión</h1>
        <p class="auth-subtitle">Accede a tu cuenta para gestionar vehículos</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="tu@correo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" class="form-input" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <div class="divider">o</div>
      <button class="btn-google" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l6-6C34.3 3 29.4 1 24 1 14.6 1 6.7 6.7 3.2 14.7l7 5.4C12 14.4 17.5 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z"/>
          <path fill="#FBBC05" d="M10.2 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.7-4.6l-7-5.4A23.3 23.3 0 0 0 .5 24c0 3.8.9 7.4 2.5 10.6l7.2-6z"/>
          <path fill="#34A853" d="M24 47c5.4 0 10-1.8 13.3-4.9l-7.4-5.7c-1.8 1.2-4.1 2-6.9 2-6.5 0-12-4.9-13.8-11.4l-7.2 6C6.6 41.3 14.6 47 24 47z"/>
        </svg>
        Iniciar sesión con Google
      </button>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        <p><a href="listado.html">Ver listado de vehículos</a> (sin iniciar sesión)</p>
      </div>
    </div>
  </div>

  <footer class="app-footer app-footer-auth">
    <div class="app-footer-inner">
      <p class="app-footer-copy">© 2025 TicoAutos · Programación en Ambiente Web</p>
      <div class="app-footer-links">
        <a href="../index.html">Inicio</a>
        <a href="listado.html">Vehículos</a>
        <a href="registro.html">Registro</a>
      </div>
    </div>
  </footer>
  </div>

  <script>
    const LOGIN_URL    = window.APP_CONFIG.API_BASE + '/users/login';
    const API_ORIGIN   = window.APP_CONFIG.API_ORIGIN;
    const AUTH_TOKEN_KEY = 'authToken';
    const AUTH_USER_KEY  = 'authUser';

    // ── Manejar token recibido desde el flujo OAuth de Google ─────────────────
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      const userRaw = params.get('user');
      const error  = params.get('error');

      if (error) {
        alert('No se pudo iniciar sesión con Google. Intenta de nuevo.');
        history.replaceState({}, '', window.location.pathname);
        return;
      }

      if (token) {
        try {
          const user = userRaw ? JSON.parse(decodeURIComponent(userRaw)) : {};
          localStorage.setItem(AUTH_TOKEN_KEY, token);
          localStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));
          window.location.replace('../index.html');
        } catch {
          alert('Error procesando la autenticación con Google.');
          history.replaceState({}, '', window.location.pathname);
        }
        return;
      }
    })();

    // ── Auto-redirect si ya hay sesión ────────────────────────────────────────
    (function () {
      const token   = localStorage.getItem(AUTH_TOKEN_KEY);
      const rawUser = localStorage.getItem(AUTH_USER_KEY);
      if (!token || !rawUser) return;
      try {
        const parsed = JSON.parse(rawUser);
        if (parsed && Object.keys(parsed).length > 0) {
          window.location.replace('../index.html');
        }
      } catch {
        localStorage.removeItem(AUTH_USER_KEY);
        localStorage.removeItem(AUTH_TOKEN_KEY);
      }
    })();

    // ── Login tradicional ─────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const email     = document.getElementById('email').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      try {
        const resp = await fetch(LOGIN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: contrasena }),
        });
        const data = await resp.json().catch(() => ({}));

        // ── Cuenta pendiente de activación ──────────────────────────────────
        if (resp.status === 403 && data.code === 'PENDING_ACTIVATION') {
          window.location.href = `cuenta-pendiente.html?email=${encodeURIComponent(email)}`;
          return;
        }

        if (!resp.ok) {
          throw new Error(data?.message || 'Credenciales inválidas');
        }

        // ── Requiere 2FA: guardar token temporal y redirigir ─────────────────
        if (data.requiresTwoFactor && data.pendingLoginToken) {
          sessionStorage.setItem('pendingLoginToken', data.pendingLoginToken);
          if (data.smsSent === false) {
            sessionStorage.setItem('smsWarning', 'El SMS no pudo ser entregado. Revisa la consola del servidor para obtener el código OTP.');
          }
          window.location.href = 'verificar-sms.html';
          return;
        }

        // ── Login directo: guardar sesión y redirigir ─────────────────────────
        if (!data.token) throw new Error('No se recibió token de autenticación');
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify(data.user || { email }));
        window.location.href = '../index.html';
      } catch (err) {
        console.error('Error en autenticación', err);
        alert(err.message || 'Credenciales inválidas');
      }
    });

    // ── Botón Google ──────────────────────────────────────────────────────────
    document.getElementById('btnGoogle').addEventListener('click', function () {
      window.location.href = API_ORIGIN + '/api/auth/google';
    });
  </script>
</body>
</html>
