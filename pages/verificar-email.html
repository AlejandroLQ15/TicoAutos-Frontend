<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar correo - TicoAutos</title>
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/config.js"></script>
  <style>
    .status-icon { font-size: 3rem; margin-bottom: 0.75rem; display: block; }
    .msg-box { border-radius: 8px; padding: 1rem 1.25rem; font-size: 0.875rem; margin-bottom: 1.25rem; }
    .msg-loading { background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569; }
    .msg-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .msg-error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .msg-info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .spinner { display: inline-block; width: 1.2rem; height: 1.2rem; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.4rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="auth-page">
<div class="auth-page-inner">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="../assets/TicoAutos_Logo.png" alt="TicoAutos" class="auth-logo-img">
        <span class="status-icon" id="statusIcon">⏳</span>
        <h1 class="auth-title" id="statusTitle">Verificando tu correo…</h1>
        <p class="auth-subtitle" id="statusSubtitle">Por favor espera un momento.</p>
      </div>

      <div id="msgBox" class="msg-box msg-loading">
        <span class="spinner"></span> Procesando la solicitud de activación…
      </div>

      <div id="actionArea" style="display:none;">
        <a id="actionBtn" href="login.html" class="auth-form btn-submit" style="display:block; text-align:center; text-decoration:none; padding:0.75rem 1rem; font-weight:600;">
          Ir al inicio de sesión
        </a>
      </div>

      <div class="auth-footer">
        <p><a href="cuenta-pendiente.html">Reenviar correo de activación</a></p>
        <p><a href="listado.html">Ver vehículos sin iniciar sesión</a></p>
      </div>
    </div>
  </div>

  <footer class="app-footer app-footer-auth">
    <div class="app-footer-inner">
      <p class="app-footer-copy">© 2025 TicoAutos · Programación en Ambiente Web</p>
      <div class="app-footer-links">
        <a href="../index.html">Inicio</a>
        <a href="listado.html">Vehículos</a>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </footer>
</div>

<script>
  const API_BASE     = window.APP_CONFIG.API_BASE;
  const ACTIVATE_URL = API_BASE + '/users/activate';

  function setStatus(icon, title, subtitle, msgClass, msgText, btnText, btnHref) {
    document.getElementById('statusIcon').textContent    = icon;
    document.getElementById('statusTitle').textContent   = title;
    document.getElementById('statusSubtitle').textContent = subtitle;
    const box = document.getElementById('msgBox');
    box.className = 'msg-box ' + msgClass;
    box.innerHTML = msgText;
    if (btnText) {
      const area = document.getElementById('actionArea');
      const btn  = document.getElementById('actionBtn');
      btn.textContent = btnText;
      btn.href = btnHref || 'login.html';
      area.style.display = 'block';
    }
  }

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      setStatus('⚠️', 'Enlace inválido', 'No se encontró el token de activación.',
        'msg-error', 'Este enlace no es válido. Verifica que copiaste la URL correctamente.',
        'Solicitar nuevo enlace', 'cuenta-pendiente.html');
      return;
    }

    try {
      const resp = await fetch(`${ACTIVATE_URL}?token=${encodeURIComponent(token)}`);
      const data = await resp.json().catch(() => ({}));

      if (resp.ok && data.success) {
        if (data.alreadyActive) {
          setStatus('✅', '¡Cuenta ya activa!', 'Esta cuenta ya fue activada previamente.',
            'msg-info', 'Tu cuenta ya está activa. Solo necesitas iniciar sesión.',
            'Iniciar sesión', 'login.html');
        } else {
          setStatus('🎉', '¡Correo verificado!', 'Tu cuenta ha sido activada exitosamente.',
            'msg-success', '¡Todo listo! Ya puedes iniciar sesión y usar TicoAutos.',
            'Iniciar sesión', 'login.html');
        }
      } else if (data.code === 'TOKEN_EXPIRED') {
        setStatus('⏰', 'Enlace expirado', 'El tiempo de activación ha vencido.',
          'msg-error', 'El enlace expiró. Solicita un nuevo correo de activación.',
          'Solicitar nuevo enlace', 'cuenta-pendiente.html');
      } else {
        setStatus('❌', 'Enlace inválido', 'No pudimos verificar tu correo.',
          'msg-error', data.message || 'El enlace no es válido. Puede que ya fue usado o no existe.',
          'Solicitar nuevo enlace', 'cuenta-pendiente.html');
      }
    } catch {
      setStatus('⚠️', 'Error de conexión', 'No se pudo contactar al servidor.',
        'msg-error', 'Verifica tu conexión e intenta de nuevo en unos momentos.',
        'Reintentar', `verificar-email.html?token=${encodeURIComponent(token)}`);
    }
  })();
</script>
</body>
</html>
